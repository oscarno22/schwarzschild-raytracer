[package]
name = "schwarzschild-raytracer"
version = "0.1.0"
edition = "2024"
default-run = "schwarzschild-raytracer"

[dependencies]
rayon = "1"
image = "0.25"
# The real-time viewer's window stack — a deliberate, contained exception
# to the minimal-deps rule, compiled only with --features viewer.
softbuffer = { version = "0.4", optional = true }
winit = { version = "0.30", optional = true }

[features]
viewer = ["dep:winit", "dep:softbuffer"]

[[bin]]
name = "viewer"
path = "src/bin/viewer.rs"
required-features = ["viewer"]

[profile.release]
lto = "thin"
